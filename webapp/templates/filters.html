<form class="filter-bar" method="get" hx-get="{{ request.path }}" hx-target="#resultados" hx-trigger="input changed delay:300ms, change" hx-sync="this:replace" hx-push-url="true"><div class="search-field"><label for="q">Buscar expediente</label><input class="form-control" id="q" name="q" value="{{ filters.q }}" placeholder="Nombre completo o CURP" autocomplete="off"></div><div><label for="folio">Folio</label><input class="form-control" id="folio" name="folio" value="{{ filters.folio }}" placeholder="Todos"></div><div><label for="digitalizador">Digitalizador</label><input class="form-control" id="digitalizador" name="digitalizador" value="{{ filters.digitalizador }}" placeholder="Todos"></div><div><label for="prioridad">Prioridad</label><select class="form-select" id="prioridad" name="prioridad"><option value="">Todas</option><option {% if filters.prioridad == 'Urgente' %}selected{% endif %}>Urgente</option><option {% if filters.prioridad == 'Alta' %}selected{% endif %}>Alta</option><option {% if filters.prioridad == 'Normal' %}selected{% endif %}>Normal</option><option {% if filters.prioridad == 'Baja' %}selected{% endif %}>Baja</option></select></div>{% if states %}<div><label for="estado">Estado</label><select id="estado" name="estado" class="form-select"><option value="">Todos</option>{% for state in states %}<option {% if filters.estado == state %}selected{% endif %}>{{ state }}</option>{% endfor %}</select></div><div><label for="orden">Orden</label><select id="orden" name="orden" class="form-select"><option value="nombre">Nombre</option><option value="folio_integracion">Folio</option><option value="digitalizador">Responsable</option><option value="estado">Estado</option><option value="recibido_integracion">Recepción</option><option value="uncoded">TIFF pendientes</option></select><label><input type="checkbox" name="desc" value="1" {% if request.GET.desc %}checked{% endif %}> Descendente</label></div>{% endif %}<button class="btn btn-outline-primary align-self-end">Buscar</button><a class="align-self-end btn btn-link" href="{{ request.path }}">Limpiar</a></form><p id="search-status" class="small muted" aria-live="polite">Los filtros se aplican al escribir. No se abren TIFF durante la búsqueda.</p>
